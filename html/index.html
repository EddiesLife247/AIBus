<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bus Timetable</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="stopping-sign-container" id="stopping-sign" style="display: none;">
        STOPPING
    </div>
    <div class="next-bus-display-container" id="next-bus-container" style="display: none;">
        </div>

    <div class="in-bus-container" id="in-bus-container" style="display: none;">
        <!-- Content will be generated by script.js -->
    </div>

    <div class="timetable-container" style="display: none;">
        <div class="header">
            <h1>Bus Timetable</h1>
            <div class="time-display" id="current-time">12:00 AM</div>
        <div class="close-button" id="close-button">&times;</div>

        </div>
        <div class="routes-container" id="routes-container">
            <!-- Bus routes will be dynamically inserted here -->
        </div>
        <div class="footer">
            EddiesLife247 AI Bus Routes
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
